}
.btn-primary {
  background-color: #0284c7;
  border-color: #0284c7;
}
.btn-primary:hover {
  background-color: #0369a1;
}
.btn-secondary {
  background-color: transparent;
}

.top-nav {
  display: flex;
  justify-content: flex-start;
  align-items: center;
  margin-bottom: 1rem;
}

.back-btn, .btn-back {
  display: inline-flex;
  align-items: center;
  gap: 0.35rem;
  padding: 0.25rem 0.55rem;
  font-size: 0.75rem;
  font-weight: 500;
  line-height: 1.2;
  color: #94a3b8;
  background-color: rgba(30, 41, 59, 0.7);
  border: 1px solid #334155;
  border-radius: 4px;
  text-decoration: none;
  cursor: pointer;
  transition: color 0.15s, background-color 0.15s, border-color 0.15s;
}
.back-btn:hover, .btn-back:hover {
  color: #38bdf8;
  background-color: #1e293b;
  border-color: #0284c7;
}

.license {
  margin-top: 3rem;
  font-size: 0.85rem;
  color: #94a3b8;
}
.license details {
  border: 1px solid #334155;
  border-radius: 8px;
  background-color: #1e293b;
  overflow: hidden;
  transition: border-color 0.2s;
}
.license details[open] {
  border-color: #475569;
}
.license details[open] summary {
  border-bottom: 1px solid #334155;
}
.license summary {
  cursor: pointer;
  user-select: none;
  font-weight: 500;
  color: #cbd5e1;
  text-align: center;
  padding: 0.75rem 1rem;
  outline: none;
}
.license summary:hover {
  color: #38bdf8;
}
.license pre {
  white-space: pre;
  word-break: normal;
  font-family: ui-monospace, "SFMono-Regular", Menlo, Monaco, Consolas, "Liberation Mono", monospace;
  font-size: 0.7rem;
  line-height: 1.55;
  margin: 0;
  padding: 1rem 1.25rem;
  background-color: #0b1120;
  border: none;
  border-radius: 0;
  color: #cbd5e1;
  text-align: center;
  max-height: 440px;
  overflow-y: auto;
  overflow-x: auto;
  scrollbar-width: thin;
  scrollbar-color: #475569 #0b1120;
}
.license pre::-webkit-scrollbar {
  width: 6px;
  height: 6px;
}
.license pre::-webkit-scrollbar-track {
  background: #0b1120;
}
.license pre::-webkit-scrollbar-thumb {
  background: #475569;
  border-radius: 3px;
}</style>

    <div id="app"></div>
