[package]
name = "htmlvm"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[[bin]]
name = "main"
path = "src/main.rs"
required-features = ["ssr"]

[features]
default = ["ssr"]
ssr = [
    "leptos/ssr",
    "leptos_router/ssr",
    "leptos_meta/ssr",
    "dep:any_spawner",
    "dep:argon2",
    "dep:axum",
    "dep:chrono",
    "dep:hmac",
    "dep:leptos_axum",
    "dep:lettre",
    "dep:password-hash",
    "dep:rand",
    "dep:rusqlite",
    "server_fn/ssr",
    "dep:ssh-key",
    "dep:tokio",
    "dep:tower",
    "dep:tower-http",
    "dep:tracing-subscriber",
]
hydrate = [
    "leptos/hydrate",
    "dep:console_error_panic_hook",
]

[dependencies]
futures = "0.3"
bytes = "1"
form_urlencoded = "1.2"
mime_guess = "2.0"
rust-embed = { version = "8", features = ["debug-embed", "include-exclude"] }
server_fn = { version = "0.8", features = ["multipart"] }
leptos = { version = "0.8", default-features = false }
leptos_router = { version = "0.8", default-features = false }
leptos_meta = { version = "0.8", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yml = "0.0.13"
base64 = "0.23"
sha2 = "0.11"
wasm-bindgen = "=0.2.130"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Blob",
    "CustomEvent",
    "Document",
    "Element",
    "File",
    "FileList",
    "FormData",
    "Headers",
    "History",
    "HtmlAnchorElement",
    "HtmlElement",
    "HtmlInputElement",
    "Location",
    "MessageEvent",
    "MouseEvent",
    "PopStateEvent",
    "Request",
    "RequestInit",
    "Response",
    "Url",
    "WebSocket",
    "Window",
] }
console_error_panic_hook = { version = "0.1", optional = true }
chrono = { version = "0.4", features = ["serde"], optional = true }
axum = { version = "0.8", features = ["multipart", "ws"], optional = true }
tokio = { version = "1", features = ["full"], optional = true }
tower-http = { version = "0.7", features = ["fs", "trace"], optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }
rusqlite = { version = "0.41", optional = true }
hmac = { version = "0.13", optional = true }
argon2 = { version = "0.6", optional = true }
password-hash = { version = "0.6", features = ["rand_core"], optional = true }
ssh-key = { version = "0.6", features = ["ed25519"], optional = true }
rand = { version = "0.10", optional = true }
tower = { version = "0.5", features = ["util"], optional = true }
leptos_axum = { version = "0.8", optional = true }
any_spawner = { version = "0.3", features = ["tokio"], optional = true }
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1", "tokio1-rustls-tls"], optional = true }

[build-dependencies]
quote = "1.0"
proc-macro2 = "1.0"

[profile.dev]
opt-level = 0

[profile.dev.package."*"]
opt-level = 1

[profile.release]
opt-level = 2
lto = false
strip = true

[profile.release.package."*"]
opt-level = 3