[package]
name = "htmlvm"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[[bin]]
name = "main"
path = "src/main.rs"
required-features = ["ssr"]

[features]
default = ["ssr"]
ssr = [
    "leptos/ssr",
    "leptos_router/ssr",
    "leptos_meta/ssr",
    "dep:any_spawner",
    "dep:axum",
    "dep:leptos_axum",
    "dep:rand",
    "dep:rusqlite",
    "server_fn/ssr",
    "dep:tokio",
    "dep:tower-http",
    "dep:tracing-subscriber",
]
hydrate = [
    "leptos/hydrate",
    "dep:console_error_panic_hook",
]

[dependencies]
futures = "0.3"
server_fn = { version = "0.8", features = ["multipart"] }
leptos = { version = "0.8", default-features = false }
leptos_router = { version = "0.8", default-features = false }
leptos_meta = { version = "0.8", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_yml = "0.0.13"
wasm-bindgen = "=0.2.130"
console_error_panic_hook = { version = "0.1", optional = true }
axum = { version = "0.8", features = ["multipart", "ws"], optional = true }
tokio = { version = "1", features = ["full"], optional = true }
tower-http = { version = "0.7", features = ["fs", "trace"], optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }
rusqlite = { version = "0.41", optional = true }
rand = { version = "0.10", optional = true }
leptos_axum = { version = "0.8", optional = true }
any_spawner = { version = "0.3", features = ["tokio"], optional = true }

[build-dependencies]
quote = "1.0"

[profile.dev]
opt-level = 0

[profile.dev.package."*"]
opt-level = 1

[profile.release]
opt-level = 2
lto = false
strip = true

[profile.release.package."*"]
opt-level = 3
