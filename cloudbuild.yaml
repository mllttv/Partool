steps:
  # 1. Docker Build
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - gcr.io/$PROJECT_ID/$_APPNAME:latest
      - .
    dir: srv

  # 2. Push Image
  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - gcr.io/$PROJECT_ID/$_APPNAME

  # 3. Deploy to Cloud Run
  - name: gcr.io/cloud-builders/gcloud
    args:
      - run
      - deploy
      - $_APPNAME
      - --image
      - gcr.io/$PROJECT_ID/$_APPNAME
      - --platform
      - managed
      - --timeout
      - "300"
      - --region
      - asia-northeast1
      - --memory
      - 1Gi
      - --allow-unauthenticated

images:
  - gcr.io/$PROJECT_ID/$_APPNAME:latest

options:
  logging: CLOUD_LOGGING_ONLY